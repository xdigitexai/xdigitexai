<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="0.6" stop-color="#111827"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="orbC"><stop offset="0" stop-color="#00d4ff" stop-opacity=".5"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbP"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <linearGradient id="shimmer" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#00d4ff"/>
    <animate attributeName="x1" values="-0.4;1.4;-0.4" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1.8;0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#00d4ff" stroke-opacity="0.05"/>
  </pattern>
  <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="b8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <style>
    
  .pt { animation-name: fl; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
  @keyframes fl { from { transform: translateY(8px); opacity: .15; } to { transform: translateY(-30px); opacity: .85; } }
    .pan { animation: pan 9s linear infinite; }
    @keyframes pan { to { transform: translateX(44px); } }
    .orb { animation: drift 16s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .o2 { animation-duration: 21s; animation-delay: -7s; }
    .o3 { animation-duration: 26s; animation-delay: -13s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(46px,-34px) scale(1.18); } }
    .scan { animation: sweep 7s ease-in-out 2s infinite; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1500px); } }
    .t { animation: rise .7s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .tpulse { animation: tp 4s ease-in-out infinite; }
    @keyframes tp { 0%,100% { opacity: .22; } 50% { opacity: .55; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
    .hotpill { animation: hp 3s ease-in-out infinite; }
    @keyframes hp { 0%,100% { stroke-opacity: .95; } 50% { stroke-opacity: .3; } }
    .dl { animation: dlp 3s ease-in-out infinite; }
    @keyframes dlp { 0%,100% { opacity: .9; } 50% { opacity: .35; } }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 1s; } .d3 { animation-delay: 2s; }
  </style>
</defs>

