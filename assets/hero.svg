<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 700 28px "Segoe UI", system-ui, sans-serif; fill: #f0f6fc; letter-spacing: -0.5px; }
      .sub   { font: 400 14px "Segoe UI", system-ui, sans-serif; fill: #8b949e; letter-spacing: 0.5px; }
      .tag   { font: 600 11px "Segoe UI", system-ui, sans-serif; fill: #00d4ff; }
      .dot   { fill: #00d4ff; }
      .line  { stroke: url(#line); stroke-width: 1; fill: none; }
      .pill  { rx: 6; ry: 6; fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .pill-ai { rx: 6; ry: 6; fill: #0d2137; stroke: #00d4ff; stroke-width: 1; }
      @keyframes fade-in { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
      @keyframes slide { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
      .t1 { animation: fade-in .6s ease .1s both; }
      .t2 { animation: fade-in .6s ease .3s both; }
      .t3 { animation: fade-in .6s ease .5s both; }
      .p1 { animation: fade-in .5s ease .7s both; }
      .p2 { animation: fade-in .5s ease .9s both; }
      .p3 { animation: fade-in .5s ease 1.1s both; }
      .p4 { animation: fade-in .5s ease 1.3s both; }
      .p5 { animation: fade-in .5s ease 1.5s both; }
      .scanline { animation: pulse 3s ease-in-out infinite; }
      .ln { stroke-dasharray: 200; animation: slide 1.5s ease .8s both; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>

  <!-- Scan line -->
  <rect class="scanline" x="0" y="99" width="800" height="1" fill="#00d4ff" opacity="0.06" rx="1"/>

  <!-- Left: Identity -->
  <g class="t1">
    <text x="40" y="72" class="title">Juma Wycliffe</text>
  </g>
  <g class="t2">
    <text x="40" y="96" class="sub">Founder · Xdigitex AI</text>
  </g>
  <g class="t3">
    <text x="40" y="124" class="sub" style="fill:#7c3aed;font-size:12px;letter-spacing:2px;text-transform:uppercase">AI · AUTOMATION · ENGINEERING</text>
  </g>

  <!-- Vertical divider -->
  <line class="line ln" x1="320" y1="30" x2="320" y2="170"/>

  <!-- Right: capability pills -->
  <g class="p1">
    <rect class="pill-ai" x="350" y="28" width="140" height="28"/>
    <text x="420" y="47" class="tag" text-anchor="middle">🤖 AI Agents</text>
  </g>
  <g class="p2">
    <rect class="pill" x="510" y="28" width="140" height="28"/>
    <text x="580" y="47" class="tag" text-anchor="middle" style="fill:#8b949e">⚡ Automation</text>
  </g>
  <g class="p3">
    <rect class="pill" x="350" y="68" width="140" height="28"/>
    <text x="420" y="87" class="tag" text-anchor="middle" style="fill:#8b949e">🌐 Web Platforms</text>
  </g>
  <g class="p4">
    <rect class="pill-ai" x="510" y="68" width="140" height="28"/>
    <text x="580" y="87" class="tag" text-anchor="middle">💳 Payments</text>
  </g>
  <g class="p5">
    <rect class="pill" x="350" y="108" width="300" height="28"/>
    <text x="500" y="127" class="tag" text-anchor="middle" style="fill:#7c3aed">🔌 APIs &amp; Intelligent Systems</text>
  </g>

  <!-- Bottom accent -->
  <rect x="40" y="158" width="80" height="2" rx="1" fill="#00d4ff" opacity="0.6"/>
  <text x="40" y="180" class="sub" style="font-size:11px">github.com/xdigitexai</text>
</svg>
