<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32">
<defs>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/><stop offset=".5" stop-color="#00d4ff"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <style>
    .sweep { animation: sw 5s linear infinite; }
    @keyframes sw { from { transform: translateX(-160px); } to { transform: translateX(1080px); } }
    .dia { animation: dp 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes dp { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.35); opacity: 1; } }
  </style>
</defs>
<line x1="60" y1="16" x2="1140" y2="16" stroke="url(#lg)" stroke-width="1.5" opacity=".7"/>
<rect class="sweep" x="60" y="15" width="150" height="2" fill="#ffffff" opacity=".28"/>
<path class="dia" d="M600 9 l7 7 -7 7 -7 -7 z" fill="#00d4ff"/>
</svg>